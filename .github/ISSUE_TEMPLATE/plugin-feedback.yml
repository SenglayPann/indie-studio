name: Plugin feedback
description: Something in the Indie Studio plugin was wrong, in the way, or missing
title: "[feedback] "
labels: ["plugin-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the plugin. Describe what the **plugin** did, not what your game is.
        Please do not paste your game concept, your code, API keys, or anything else private.
        `/indie-studio:plugin-feedback send` prepares this text for you from the notes in your project.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `.claude-plugin/plugin.json`, or the `/plugin` menu in Claude Code.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill or file
      placeholder: "scope-guard, or templates/git/githooks/pre-commit"
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem was it?
      options:
        - Wrong advice
        - Outdated fact (a version, store rule, price, or licence changed)
        - Got in the way
        - Did not start when it should have
        - Started when it should not have
        - Something was missing
        - Setup, hook, or template failure
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How bad was it?
      options:
        - Blocker (work stopped)
        - Annoying (work continued)
        - Minor
  - type: input
    id: stage
    attributes:
      label: Phase and stage
      placeholder: "Pre-Production / Vertical Slice"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the studio said or did, and what you were doing at the time.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional. Even a rough idea helps.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Optional. A source URL with the date it was checked, or the exact words that were wrong.
